<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="a_css/showAll.css" />
    <script defer src="a_js/common.js"></script>
    <!-- 表示部品は、呼ぶ側（outPosts.js）より先に読み込む -->
    <script defer src="a_js/showAllGimic.js"></script>
    <script defer src="a_js/outPosts.js"></script>
    <title>出力</title>
  </head>
  <body>
    <header>
      <h1>ピット情報を出力</h1>
      <p>プレビューを見て出力先を選択してください</p>

      <nav>
        <!-- 操作系 -->
        <ul id="action">
          <li><button id="csv">CSVファイルで出力</button></li>
          <li><button id="pdf">PDFファイルで出力</button></li>
        </ul>
      </nav>
    </header>

    <main class="table-wrap">
      <h2>プレビュー画面</h2>
      <table class="grid-table" aria-label="ピット情報">
        <!-- 見出しは showAllGimic.js の PIT_LOG_COLUMNS から作る（04章§4.3）。
             直書きすると、列を足したときに本文とずれる -->
        <thead id="thead"></thead>
        <tbody id="tbody"></tbody>
      </table>
    </main>
  </body>
</html>
