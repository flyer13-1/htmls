<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="a_css/showAll.css" />
    <script defer src="a_js/common.js"></script>
    <!-- 表示部品は、呼ぶ側（showAll.js）より先に読み込む -->
    <script defer src="a_js/showAllGimic.js"></script>
    <script defer src="a_js/showAll.js"></script>
    <title>showAll</title>
  </head>
  <body>
    <header>
      <h1>ピット情報を確認</h1>
      <p>入力の際は画面の表記通りに書いてください</p>

      <nav>
        <!-- 操作系 -->
        <ul id="action">
          <li><button id="all">ピットイン順</button></li>
          <li><button id="reset">更新</button></li>
        </ul>

        <!-- フィルター系 -->
        <ul id="filter">
          <li>
            <input
              type="text"
              id="search"
              pattern="^\d+$|^[^\d].*$"
              placeholder="ゼッケン番号 or 担当者名"
            />
          </li>
          <!--クラス用のボタンを作成-->
        </ul>
      </nav>
    </header>

    <main class="table-wrap">
      <table class="grid-table" aria-label="ピット情報">
        <!-- 見出しは showAllGimic.js の PIT_LOG_COLUMNS から作る（04章§4.3）。
             直書きすると、列を足したときに本文とずれる -->
        <thead id="thead"></thead>
        <tbody id="tbody"></tbody>
      </table>
    </main>
  </body>
</html>
