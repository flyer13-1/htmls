<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="a_css/conform.css" />
    <script defer src="a_js/common.js"></script>
    <script defer src="a_js/conform.js"></script>
    <title>確認画面</title>
  </head>
  <body>
    <header>
      <h1>OfficialSupportSystem</h1>
      <h2>確認画面</h2>
    </header>

    <main>
      <article id="main">
        <p>大会IDを入力してください</p>
        <form id="form">
          <section>
            <label for="todayId">当日配布された大会ID:</label>
            <input
              type="text"
              id="todayId"
              name="todayId"
              required
              minlength="15"
              pattern="[A-Za-z0-9_!\-]+"
              title="半角英数字と記号(-_!)で15文字以上で入力してください"
            />
          </section>

          <input type="submit" id="submit" value="送信" />
        </form>

        <button id="conformBtn">プロフィール確認</button>
      </article>

      <article id="conform" style="display: none">
        <h2>プロフィール</h2>
        <p id="textUser">担当者名:</p>
        <p id="textCir">所属サーキット:</p>

        <button id="backBtn">戻る</button>
      </article>

      <article id="success" style="display: none">
        <p>大会IDが承認されました！</p>
      </article>
    </main>
  </body>
</html>
