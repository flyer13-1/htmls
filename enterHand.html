<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="a_css/enterShared.css" />
    <script defer src="a_js/common.js"></script>
    <script defer src="a_js/enterHand.js"></script>
    <title>handEnter</title>
  </head>
  <body>
    <header>
      <h1>手動入力モード</h1>
      <p>時刻を手入力し、入力が終わったら送信ボタンを押してください。</p>
    </header>

    <main>
      <article id="carInfo">
        <form id="myForm" method="post">
          <h2>ゼッケン番号</h2>
          <section id="carNum"></section>
          <!-- 車番ラジオは js で生成 -->

          <h2>ピット時間</h2>
          <section id="Time">
            <label>ピット時刻（イン / アウト）</label>
            <input type="time" id="inTime" step="1" />
            <input type="time" id="outTime" step="1" />
          </section>

          <h2>交代したドライバー</h2>
          <section id="Driver">
            <input type="radio" name="driver" id="driverA" value="A" />
            <label for="driverA"
              >A <br />
              ドライバー名</label
            >

            <input type="radio" name="driver" id="driverB" value="B" />
            <label for="driverB"
              >B<br />
              ドライバー名</label
            >

            <input type="radio" name="driver" id="driverC" value="C" />
            <label for="driverC"
              >C<br />
              ドライバー名</label
            >

            <input type="radio" name="driver" id="driverD" value="D" />
            <label for="driverD"
              >D<br />
              ドライバー名</label
            >

            <input type="radio" name="driver" id="driverE" value="E" />
            <label for="driverE"
              >E<br />
              ドライバー名</label
            >

            <input type="radio" name="driver" id="driverF" value="F" />
            <label for="driverF"
              >F<br />
              ドライバー名</label
            >
          </section>

          <h2>作業内容</h2>
          <section id="task">
            <input type="checkbox" id="tires" value="tire" />
            <label for="tires">タイヤ交換</label>

            <input type="checkbox" id="oils" value="oil" />
            <label for="oils">給油</label>
          </section>

          <section id="notes">
            <h2>備考欄</h2>
            <input type="text" id="note" maxlength="200" />
          </section>

          <section id="submits">
            <button type="submit" id="submitContinue">
              送信して入力を続ける
            </button>
            <button type="submit" id="submitBack">
              送信してモード選択へ戻る
            </button>
          </section>
        </form>
      </article>
      <article id="log">
        <h2>送信ログ</h2>
        <div id="logContent">ここに送信した内容を表示します。</div>
      </article>
    </main>
  </body>
</html>
