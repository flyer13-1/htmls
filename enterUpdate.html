<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="a_css/enterShared.css" />
    <link rel="stylesheet" href="a_css/updateEnter.css" />
    <link rel="stylesheet" href="a_css/common.css" />
    <script defer src="a_js/common.js"></script>
    <script defer src="a_js/enterUpdate.js"></script>
    <title>updateEnter</title>
  </head>

  <body>
    <header>
      <h1>変更モード</h1>
    </header>

    <main>
      <article>
        <p>最初に変更したい車両を指定してください。</p>
        <input type="number" id="carNum" max="999" />

        <!-- リタイアの状態（ピット記録とは独立）。記録が1件も無い車でも
             取り消せるように、表の外に置く -->
        <section id="retireArea" hidden>
          <h2>リタイア</h2>
          <p id="retireState"></p>
          <div id="retireReasonField">
            <label for="retireReason">理由</label>
            <input type="text" id="retireReason" maxlength="200" />
          </div>
          <div id="retireActions">
            <button type="button" id="retireReasonBtn">理由を変更する</button>
            <button type="button" id="retireCancelBtn" class="danger">
              リタイアを取り消す
            </button>
          </div>
        </section>

        <div id="showCarData">
          <table class="grid-table" aria-label="ピット情報">
            <thead>
              <tr>
                <th>変更</th>
                <th>ピット番号</th>
                <th>ゼッケン番号</th>
                <th>担当者</th>
                <th>リタイア</th>
                <th>インドライバー</th>
                <th>アウトドライバー</th>
                <th>ピットイン</th>
                <th>ピットアウト</th>
                <th>備考</th>
              </tr>
            </thead>
            <tbody id="tbody"></tbody>
          </table>
        </div>
      </article>

      <p>
        次に変更内容を記入してください。変更がない場合は未記入でお願いします
      </p>

      <form id="myForm" method="post"></form>
    </main>
  </body>
</html>
