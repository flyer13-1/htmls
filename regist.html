<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="a_css/formPage.css" />
    <link rel="stylesheet" href="a_css/common.css" />
    <script src="https://unpkg.com/amazon-cognito-identity-js@6/dist/amazon-cognito-identity.min.js"></script>
    <script defer src="a_js/common.js"></script>
    <script defer src="a_js/passCheck.js"></script>
    <script defer src="a_js/passConfirmCheck.js"></script>
    <script defer src="a_js/regist.js"></script>
    <title>アカウント登録</title>
  </head>
  <body>
    <header>
      <h1>OfficialSupportSystem</h1>
      <h2>アカウント登録ページ</h2>
    </header>

    <main>
      <!-- ステップ1: サインアップフォーム(ユーザー名・パスワード・メール・サーキット) -->
      <article id="formArea">
        <form id="form">
          <section>
            <label for="username">担当者名*:</label>
            <input
              type="text"
              id="username"
              name="username"
              required
              minlength="3"
              maxlength="20"
              pattern="[ぁ-んァ-ヶ\u4E00-\u9FFF\u3400-\u4DBF]+"
              title="ひらがな・カタカナ・漢字で入力してください（3文字〜20文字以内）"
              placeholder="無線で利用する名前を記入してください"
            />
            <p class="charNote">
              使用可能文字：ひらがな・カタカナ・漢字（3〜20文字）。
            </p>
          </section>

          <section>
            <label for="email">メールアドレス*:</label>
            <input
              type="email"
              id="email"
              name="email"
              required
              placeholder="example@example.com"
            />
            <p class="charNote">
              確認コードの送り先です。打ち間違えると登録できません。
            </p>
          </section>

          <section>
            <label for="emailConfirm">確認用メールアドレス*:</label>
            <input
              type="email"
              id="emailConfirm"
              required
              placeholder="もう一度入力してください"
              data-confirms="email"
              data-label="メールアドレス"
              data-errmsg="emailConfError"
            /><br />
            <small id="emailConfError"></small>
          </section>

          <section>
            <label for="password">パスワード*:</label>
            <input
              type="password"
              id="password"
              name="password"
              minlength="6"
              maxlength="20"
              required
              data-passcheck
              data-errmsg="errMsg"
            />
            <br />
            <small id="errMsg"></small>
          </section>

          <section>
            <label for="passConfirm">確認用パスワード*:</label>
            <input
              type="password"
              id="passConfirm"
              minlength="6"
              maxlength="20"
              required
              data-confirms="password"
              data-label="パスワード"
              data-errmsg="passConfError"
            /><br />
            <small id="passConfError"></small>
          </section>

          <section>
            <label for="circuit">メインサーキットを選択*</label>
            <select id="circuit" name="circuit" required>
              <!-- １：富士　2：茂木　3：菅生　4:鈴鹿　5:岡山国際　6:その他　7:無所属 -->
              <option value="">-- 選択してください --</option>
              <option value="1">富士SpeedWay</option>
              <option value="2">ツインリンクもてぎ</option>
              <option value="3">スポーツランド菅生</option>
              <option value="4">鈴鹿</option>
              <option value="5">岡山国際</option>
              <option value="6">その他</option>
              <option value="7">無所属</option>
            </select>
          </section>

          <section>
            <!-- data-submit: この区画の送信ボタン。判定表が全欄OKになるまで無効
                 （doc/IF/common.md §6） -->
            <input
              type="submit"
              value="アカウント登録"
              id="submit"
              data-submit
              disabled
            />
          </section>
        </form>
      </article>

      <!-- ステップ2: メール確認コード入力欄(サインアップ後に表示) -->
      <article id="codeArea" hidden>
        <p id="resendMsg" style="color: green; font-weight: bold"></p>

        <p>
          記入されたEMailアドレスに確認コードを送信しました。<br />
          メールに届いた確認コードを入力してください
        </p>
        <input
          id="code"
          placeholder="確認コードを入力"
          required
          data-required
          data-errmsg="codeErrMsg"
        />
        <small id="codeErrMsg"></small>
        <!-- type="button" のためブラウザの標準検証は働かない。
             判定表（data-required）が空入力を止める（doc/IF/common.md §6） -->
        <button type="button" id="confirmCodeBtn" data-submit disabled onclick="doConfirm()">
          確認する
        </button>
        <button type="button" onclick="doResend()">コードを再送信</button>
      </article>

      <article id="msgArea" hidden>
        <p>アカウント登録に成功！</p>
      </article>
    </main>
  </body>
</html>
